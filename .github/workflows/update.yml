name: Mise à jour du radar

on:
  schedule:
    # Tous les jours vers 6 h 17 (heure de Paris en hiver)
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calcul du radar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update.mjs

      - name: Enregistrement
        run: |
          git config user.name "pepite-robot"
          git config user.email "pepite-robot@users.noreply.github.com"
          git add data public
          git diff --staged --quiet || git commit -m "Radar du $(date -u +%F)"
          git push
